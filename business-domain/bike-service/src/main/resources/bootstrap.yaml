spring:
#   profiles:
#     active: @spring.profiles.active@
    application:
        name: bike-service
        description: Servlet RESTful App focus on Bike Domain
    cloud:
        config:
            enabled: true
            uri: http://${CONFIG_SERVER_URI:localhost}:${CONFIG_SERVER_PORT:8888}
    security:
      user:
         name: admin
         password: admin
         roles: ADMIN
      cors:
         allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      oauth2:
         resourceserver:
            jwt:
               issuer-uri: http://${KEYCLOAK_SERVER_URI:localhost}:${KEYCLOAK_SERVER_PORT:8091}/realms/UserServiceRealm
