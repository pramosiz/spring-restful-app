server:
  port: 8002
spring:
  application:
    name: car-service
  ############################
  # Databse Connection      ##
  ############################
  datasource:
    url: jdbc:postgresql://${PG_DB_URL:localhost}:${PG_DB_PORT:5432}/${PG_DB_NAME:test}
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PWD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: ${PG_DB_SCHEMA:user-app}
      dialect: org.hibernate.dialect.PostgreSQLDialect
  ##############
  # RabbitMQ  ##
  ##############
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:test}
    password: ${RABBITMQ_PWD:test}
    virtual-host: ${RABBITMQ_VHOST:test}
############
# Eureka  ##
############
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_URI:localhost}:${EUREKA_SERVER_PORT:8761}/eureka
  instance:
    instanceId: ${spring.application.name}:${spring.application.instance-id:${random.name}}
