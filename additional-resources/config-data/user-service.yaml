server:
  port: 8001
spring:
  application:
    name: user-service
    description: Servlet RESTful App focus on User Domain
  ############################
  # Databse Connection      ##
  ############################
  datasource:
    url: jdbc:postgresql://${PG_DB_URL:localhost}:${PG_DB_PORT:5432}/${PG_DB_NAME:test}
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PWD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: ${PG_DB_SCHEMA:user-app}
      dialect: org.hibernate.dialect.PostgreSQLDialect
  ##############
  # RabbitMQ  ##
  ##############
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:test}
    password: ${RABBITMQ_PWD:test}
    virtual-host: ${RABBITMQ_VHOST:test}
################
# Connections ##
################
services:
  car-service:
    path: http://${CAR_SERVICE_URL:localhost}:${CAR_SERVICE_PORT:8002}
  bike-service:
    path: http://${BIKE_SERVICE_URL:localhost}:${BIKE_SERVICE_PORT:8003}
