server:
  port: 8003
spring:
  application:
    name: bike-service
  ############################
  # Databse Connection      ##
  ############################
  datasource:
    url: jdbc:postgresql://${PG_DB_URL:localhost}:${PG_DB_PORT:5432}/${PG_DB_NAME:test}
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PWD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: ${PG_DB_SCHEMA:user-app}
      dialect: org.hibernate.dialect.PostgreSQLDialect
  ##############
  # RabbitMQ  ##
  ##############
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:test}
    password: ${RABBITMQ_PWD:test}
    virtual-host: ${RABBITMQ_VHOST:test}
  ############
  # Eureka  ##
  ############
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_URI:localhost}:${EUREKA_SERVER_PORT:8761}/eureka
  instance:
    instanceId: ${spring.application.name}:${spring.application.instance-id:${random.name}}
    preferIpAddress: true

####################
# Circuit Breaker ##
####################
resilience4j.circuitbreaker:
  instances:
    userService:
      registerHealthIndicator: true # Register CircuitBreakerHealthIndicator
      slidingWindowSize: 10 # Number of calls in the sliding window
      permittedNumberOfCallsInHalfOpenState: 3 # Number of permitted calls in half open state
      slidingWindowType: TIME_BASED
      minimumNumberOfCalls: 4
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
