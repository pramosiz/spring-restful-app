server:
  port: 8003
spring:
  application:
    name: bike-service
    description: Servlet RESTful App focus on Bike Domain
  ############################
  # Databse Connection      ##
  ############################
  datasource:
    url: jdbc:postgresql://${PG_DB_URL:localhost}:${PG_DB_PORT:5432}/${PG_DB_NAME:test}
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PWD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: ${PG_DB_SCHEMA:user-app}
      dialect: org.hibernate.dialect.PostgreSQLDialect
  ##############
  # RabbitMQ  ##
  ##############
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:test}
    password: ${RABBITMQ_PWD:test}
    virtual-host: ${RABBITMQ_VHOST:test}
