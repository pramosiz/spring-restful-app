apiVersion: apps/{{ .Values.apiVersion }}
kind: Deployment
metadata:
  name: {{ .Values.global.postgresql.deployment.name }}
  labels:
    app: {{ .Values.global.postgresql.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.postgresql.name }}
  strategy:
    type: Recreate
  minReadySeconds: {{ .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        app: {{ .Values.global.postgresql.name }}
    spec:
      containers:
        - name: {{ .Values.global.postgresql.name }}
          image: {{ .Values.image }}:{{ .Values.version }}
          ports:
            - containerPort: {{ .Values.global.postgresql.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.global.postgresql.db }}
            - name: POSTGRES_USER
              value: {{ .Values.global.postgresql.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.global.postgresql.password }}
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.mountPath }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{.Values.resources.limits.memory }}
              cpu: {{.Values.resources.limits.cpu}}
      restartPolicy: Always
      volumes:
        - name: postgres-storage
          hostPath:
            path: {{ .Values.mountHost }}
