###################################
#####  PostgreSQL Deployment  #####
###################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deploy
  namespace: user-app
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14.13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: test
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
      volumes:
        - name: postgres-storage
          hostPath:
            path: /Users/pabloramosizquierdo/Desktop/Pablo/Dockers/PostgreSQL/data

---
################################
#####  PostgreSQL Service  #####
################################
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: user-app
  labels:
    app: postgres
spec:
  type: ClusterIP # This is the default value
  ports:
    - name: postgres-port
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
