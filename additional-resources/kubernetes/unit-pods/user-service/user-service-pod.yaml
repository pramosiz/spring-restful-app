######################
#####  User Pod  #####
######################
apiVersion: v1
kind: Pod
metadata:
  name: user-service-pod
  namespace: user-app
  labels:
    app: user-service
spec:
  containers:
    - name: user-service
      image: user-service:1.0.0
      ports:
        - containerPort: 8001
      env:
        - name: CONFIG_SERVER_URI
          value: config-svc
        - name: CONFIG_SERVER_PORT
          value: "8888"
        - name: PG_DB_URL
          value: postgres-svc
        - name: PG_DB_PORT
          value: "5432"
        - name: PG_DB_NAME
          value: test
        - name: PG_DB_USER
          value: postgres
        - name: PG_DB_PWD
          value: postgres
        - name: PG_DB_SCHEMA
          value: user-app
        - name: RABBITMQ_HOST
          value: rabbitmq-svc
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: test
        - name: RABBITMQ_PWD
          value: test
        - name: RABBITMQ_VHOST
          value: test
        - name: CAR_SERVICE_URL
          value: car-service
        - name: CAR_SERVICE_PORT
          value: "8002"
        - name: BIKE_SERVICE_URL
          value: bike-service
        - name: BIKE_SERVICE_PORT
          value: "8003"
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      restartPolicy: OnFailure
