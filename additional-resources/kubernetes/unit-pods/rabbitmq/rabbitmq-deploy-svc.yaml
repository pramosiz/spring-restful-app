#################################
#####  RabbitMQ Deployment  #####
#################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deploy
  namespace: user-app
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: Recreate
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq-user
          image: rabbitmq_user:v1
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always

---
##############################
#####  RabbitMQ Service  #####
##############################
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-svc
  namespace: user-app
  labels:
    app: rabbitmq
spec:
  type: NodePort
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30673
  selector:
    app: rabbitmq
